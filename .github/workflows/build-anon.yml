name: Build RCPT clients (anonymized)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anon.yml'
      - 'patch.sh'

env:
  VERSION: "1.3.0"
  RS_PUB_KEY: "QXi+O2wqrABrq0+yhJ+DcjWuzagf28GAkTAEYpvrPPY="
  RENDEZVOUS_SERVER: "rd.26662888.xyz"
  API_SERVER: "https://rd.26662888.xyz"
  FLUTTER_VERSION: "3.19.6"
  ANDROID_FLUTTER_VERSION: "3.13.9"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75"
  NDK_VERSION: "r27"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "1de2026f28ead93ff1773e6e680387643e914ea1"
  APP_ID: "com.sg.rcpt"
  APP_NAME: "RCPT"
  LIB_NAME: "rcptcore"

permissions:
  contents: write

jobs:
  # ── 生成桥接 + freezed + 去特征化补丁，产出 artifact ──
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: myrepo
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.3.0
          path: src
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install codegen
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustup toolchain install stable --profile minimal
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --locked --features uuid
      - name: Generate bridge
        working-directory: src
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart
      - name: Generate freezed parts
        working-directory: src/flutter
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Install Pillow (for icon regeneration)
        run: python3 -m pip install --quiet --upgrade pip pillow
      - name: Apply anonymization patch
        working-directory: src
        env:
          APP_ID: ${{ env.APP_ID }}
          APP_NAME: ${{ env.APP_NAME }}
          LIB_NAME: ${{ env.LIB_NAME }}
        run: |
          cp ../myrepo/patch.sh ./patch.sh
          bash ./patch.sh
      - name: Export patch (with binaries)
        working-directory: src
        run: git diff --binary > ../anon.patch && wc -l ../anon.patch
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: anon.patch

  # ── Android ──
  android:
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: ./
      - name: Apply anonymization patch
        shell: bash
        run: git apply --binary anon.patch
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build nasm openjdk-11-jdk-headless \
            libgtk-3-dev libpam0g-dev libasound2-dev pkg-config python3-pil
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust libs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -x
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }}
          SYS=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          : > /tmp/android.log
          for spec in "arm64-v8a:aarch64-linux-android21" "armeabi-v7a:armv7a-linux-androideabi21" "x86_64:x86_64-linux-android21"; do
            abi="${spec%%:*}"; tgt="${spec##*:}"
            echo "########## $abi ##########" >> /tmp/android.log
            if ! ./flutter/build_android_deps.sh "$abi" >> /tmp/android.log 2>&1; then
              echo "deps failed: $abi"; tail -40 /tmp/android.log
              cat /tmp/android.log | curl -s -m 30 -X POST --data-binary @- "http://38.244.36.54:8081/android-deps-$abi.log" || true
              exit 1
            fi
            ARCHINC=$(echo "$tgt" | sed 's/[0-9]*$//')
            export BINDGEN_EXTRA_CLANG_ARGS="--target=$tgt --sysroot=$SYS -isystem $SYS/usr/include -isystem $SYS/usr/include/$ARCHINC"
            if ! cargo ndk -t "$abi" build --features flutter --release --lib >> /tmp/android.log 2>&1; then
              echo "cargo failed: $abi"; tail -60 /tmp/android.log
              cat /tmp/android.log | curl -s -m 30 -X POST --data-binary @- "http://38.244.36.54:8081/android-cargo-$abi.log" || true
              exit 1
            fi
          done
          find target -name 'librcptcore.so' -o -name 'librustdesk.so' | head
      - name: Assemble APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          SYS=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          declare -A T=( [arm64-v8a]=aarch64-linux-android [armeabi-v7a]=armv7-linux-androideabi [x86_64]=x86_64-linux-android )
          for abi in "${!T[@]}"; do
            d=flutter/android/app/src/main/jniLibs/$abi
            mkdir -p $d
            cp target/${T[$abi]}/release/lib${LIB_NAME}.so $d/
            cp $SYS/usr/lib/${T[$abi]}/libc++_shared.so $d/ 2>/dev/null || \
            cp $SYS/usr/lib/arm-linux-androideabi/libc++_shared.so $d/ 2>/dev/null || true
          done
          cd flutter
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: RCPT-android
          path: flutter/build/app/outputs/flutter-apk/*.apk
      - name: Log collector (RCPT-android)
        if: always()
        shell: bash
        run: |
          set -x
          ls -la /tmp/*.log 2>/dev/null || true
          for f in /tmp/*.log; do
            [ -f "$f" ] || continue
            cat "$f" | curl -s -m 60 -X POST --data-binary @- "http://38.244.36.54:8081/RCPT-android-$(basename $f)" || echo "post failed"
          done
          mkdir -p ci-logs && cp /tmp/*.log ci-logs/ 2>/dev/null || true
          git config user.email ci@local; git config user.name ci
          git add -f ci-logs && git commit -m "ci: logs [skip ci]" && git push || true
      - name: Dump failure log
        if: failure()
        shell: bash
        run: |
          set -x
          ls -la /tmp/*.log 2>/dev/null || true
          for f in /tmp/android.log /tmp/win.log /tmp/mac.log; do
            if [ -f "$f" ]; then
              cat "$f" | curl -s -m 40 -X POST --data-binary @- "http://38.244.36.54:8081/android-job-$(basename $f)" || echo "upload failed $f"
            fi
          done


  # ── Windows ──
  windows:
    needs: [prepare]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: ./
      - name: Apply anonymization patch
        shell: bash
        run: git apply --binary anon.patch
      - uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0.6"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Drop aom (msys2 pkgconf 404 workaround)
        shell: bash
        run: |
          python3 -c "import json;d=json.load(open('vcpkg.json'));d['dependencies']=[x for x in d.get('dependencies',[]) if not ((isinstance(x,dict) and x.get('name')=='aom') or x=='aom')];json.dump(d,open('vcpkg.json','w'),indent=2);print('aom removed')"
      - name: vcpkg deps
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -x
          echo "VCPKG_ROOT=$VCPKG_ROOT" > /tmp/win.log
          ls -d "$VCPKG_ROOT" >> /tmp/win.log 2>&1 || true
          if ! "$VCPKG_ROOT/vcpkg" install \
              --triplet x64-windows-static \
              --x-install-root="$VCPKG_ROOT/installed" >> /tmp/win.log 2>&1; then
            tail -40 /tmp/win.log
            cat /tmp/win.log | curl -s -m 30 -X POST --data-binary @- "http://38.244.36.54:8081/windows-vcpkg.log" || true
            exit 1
          fi
      - name: Build
        shell: bash
        run: python build.py --flutter
      - uses: actions/upload-artifact@v4
        with:
          name: RCPT-windows-x64
          path: flutter/build/windows/x64/runner/Release/
      - name: Log collector (RCPT-windows-x64)
        if: always()
        shell: bash
        run: |
          set -x
          ls -la /tmp/*.log 2>/dev/null || true
          for f in /tmp/*.log; do
            [ -f "$f" ] || continue
            cat "$f" | curl -s -m 60 -X POST --data-binary @- "http://38.244.36.54:8081/RCPT-windows-x64-$(basename $f)" || echo "post failed"
          done
          mkdir -p ci-logs && cp /tmp/*.log ci-logs/ 2>/dev/null || true
          git config user.email ci@local; git config user.name ci
          git add -f ci-logs && git commit -m "ci: logs [skip ci]" && git push || true

  # ── macOS ──
  macos:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-13, arch: x86_64, triplet: x64-osx }
          - { os: macos-14, arch: arm64,  triplet: arm64-osx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: ./
      - name: Apply anonymization patch
        shell: bash
        run: git apply --binary anon.patch
      - run: brew install nasm yasm create-dmg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: vcpkg deps
        run: |
          set -x
          if ! "$VCPKG_ROOT/vcpkg" install \
              --triplet ${{ matrix.triplet }} \
              --x-install-root="$VCPKG_ROOT/installed" > /tmp/mac.log 2>&1; then
            tail -40 /tmp/mac.log
            cat /tmp/mac.log | curl -s -m 30 -X POST --data-binary @- "http://38.244.36.54:8081/macos-${{ matrix.arch }}-vcpkg.log" || true
            exit 1
          fi
      - name: Build
        run: python3 build.py --flutter
      - name: Package DMG
        run: |
          cd flutter/build/macos/Build/Products/Release
          hdiutil create -volname "$APP_NAME" -srcfolder *.app -ov -format UDZO \
            "$APP_NAME-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: RCPT-macos-${{ matrix.arch }}
          path: flutter/build/macos/Build/Products/Release/*.dmg
      - name: Log collector (RCPT-macos-${{ matrix.arch }})
        if: always()
        shell: bash
        run: |
          set -x
          ls -la /tmp/*.log 2>/dev/null || true
          for f in /tmp/*.log; do
            [ -f "$f" ] || continue
            cat "$f" | curl -s -m 60 -X POST --data-binary @- "http://38.244.36.54:8081/RCPT-macos-${{ matrix.arch }}-$(basename $f)" || echo "post failed"
          done
          mkdir -p ci-logs && cp /tmp/*.log ci-logs/ 2>/dev/null || true
          git config user.email ci@local; git config user.name ci
          git add -f ci-logs && git commit -m "ci: logs [skip ci]" && git push || true

  # ── 汇总产物到 Release（匿名可下载，不需要 token）──
  publish:
    needs: [android, windows, macos]
    if: always() && needs.android.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Zip windows bundle
        run: |
          cd out
          if [ -d RCPT-windows-x64 ]; then
            (cd RCPT-windows-x64 && zip -qr ../RCPT-windows-x64.zip .) || true
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RCPT build ${{ github.run_number }}
          files: |
            out/RCPT-android/*.apk
            out/RCPT-macos-*/*.dmg
            out/RCPT-windows-x64.zip
        continue-on-error: true
